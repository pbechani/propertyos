
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRIBEC — Real Estate &amp; Construction Trust Platform</title>

    <!--
      Content-Security-Policy
      Tighten these directives before production:
      - Replace 'unsafe-inline' with a nonce/hash once a bundler CSP plugin is added.
      - Replace 'unsafe-eval' with a stricter policy once dev tools no longer require it.
      - Remove data: from img-src once hardcoded placeholder images are removed.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src  'self' 'unsafe-inline';
        style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src    'self' https://fonts.gstatic.com;
        img-src     'self' data: https://images.unsplash.com;
        connect-src 'self';
        frame-src   'none';
        object-src  'none';
        base-uri    'self';
        form-action 'self';
      "
    />

    <!--
      FOUC (Flash of Unstyled Content) prevention for dark mode.
      This inline script runs before React renders and applies the correct
      theme class to <html> synchronously, so the user never sees a flash
      from the default light style to their saved dark preference.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.classList.add(stored);
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
